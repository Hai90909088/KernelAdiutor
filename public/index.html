<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kernel Adiutor</title>
  <style>
    :root {
      --amoled-bg: #000000;
      --toolbar-bg: #0e141b;
      --card-bg: #080b0f;
      --card-border: #25323f;
      --pill-bg: #040608;
      --pill-border: #364452;
      --cyan: #29b6f6;
      --cyan-track: #0d2d3b;
      --cyan-track-border: #1e5e78;
      --text: #ffffff;
      --muted: #9aa8b5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #05080c;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 900px;
      background: var(--amoled-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid #161f29;
      border-right: 1px solid #161f29;
    }

    .toolbar {
      height: 52px;
      background: var(--toolbar-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      line-height: 1;
    }

    .app-title {
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .boot-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      color: var(--muted);
    }

    .switch {
      width: 38px;
      height: 20px;
      border-radius: 999px;
      background: #44505c;
      position: relative;
      transition: background 150ms ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #cfd8dc;
      transition: transform 150ms ease, background 150ms ease;
    }

    .switch.on {
      background: rgba(41, 182, 246, 0.45);
    }

    .switch.on::after {
      transform: translateX(18px);
      background: var(--cyan);
    }

    .tabs {
      height: 44px;
      background: var(--toolbar-bg);
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid #17212b;
      flex-shrink: 0;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 0 18px;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .tab-btn.active {
      color: var(--text);
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2.5px;
      background: var(--cyan);
    }

    .tab-panel {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-panel.active {
      display: flex;
    }

    .fixed-header {
      padding: 8px 1px 6px;
      flex-shrink: 0;
    }

    .overall-bar {
      height: 22px;
      border-radius: 5px;
      background: var(--cyan-track);
      border: 1px solid var(--cyan-track-border);
      position: relative;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .bar-fill {
      height: 100%;
      background: var(--cyan);
      transition: width 250ms ease;
    }

    .bar-label-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 2px rgba(0,0,0,0.65);
    }

    .bars-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px 8px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
    }

    .bar-row-name {
      width: 42px;
      font-size: 12px;
      color: var(--cyan);
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 17px;
      border-radius: 4px;
      background: var(--cyan-track);
      border: 1px solid var(--cyan-track-border);
      position: relative;
      overflow: hidden;
    }

    .bar-row-val {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .content-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 1px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cluster-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
    }

    .cluster-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 40px;
    }

    .cluster-id {
      width: 56px;
      text-align: center;
    }

    .cluster-name {
      font-size: 13.5px;
      font-weight: 700;
    }

    .cluster-sub {
      font-size: 12px;
      font-weight: 700;
      color: var(--cyan);
    }

    .pill-select {
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 999px;
      color: var(--text);
      font-size: 13px;
      height: 34px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .pill-gov {
      flex: 1;
      height: 36px;
    }

    .pill-gov select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      width: 100%;
      text-align: center;
      outline: none;
      cursor: pointer;
      appearance: none;
    }

    .pill-gov select option,
    .freq-dropdown select option {
      background: #0e141b;
      color: #ffffff;
    }

    .cores-box {
      width: 54px;
      text-align: center;
      font-size: 12px;
      line-height: 1.25;
    }

    .freq-selector-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .freq-label {
      font-size: 12.5px;
      color: var(--cyan);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .pill-freq {
      flex: 1;
      min-width: 0;
      padding: 0 4px 0 12px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      position: relative;
    }

    .freq-val {
      flex: 1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .freq-dropdown {
      position: relative;
      width: 28px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
    }

    .freq-dropdown select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .slider-row {
      display: flex;
      align-items: center;
      height: 44px;
      margin-top: 4px;
      gap: 4px;
    }

    .step-btn {
      width: 26px;
      height: 40px;
      padding: 0;
      background: none;
      border: none;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    input[type="range"] {
      flex: 1;
      min-width: 0;
      margin: 0;
      accent-color: var(--cyan);
      cursor: pointer;
      height: 6px;
    }

    .simple-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
    }

    .simple-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--cyan);
    }

    .simple-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid #16202a;
      font-size: 13px;
    }

    .simple-row:first-of-type {
      border-top: none;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="toolbar">
      <div class="toolbar-left">
        <button class="menu-btn" aria-label="Menu">☰</button>
        <span class="app-title">Kernel Adiutor</span>
      </div>
      <div class="boot-toggle" id="bootToggle">
        <span>Khởi động</span>
        <div class="switch" id="bootSwitch"></div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="cpu">CPU</button>
      <button class="tab-btn" data-tab="gpu">GPU</button>
      <button class="tab-btn" data-tab="io">Lịch trình nhập xuất I/O</button>
    </nav>

    <section class="tab-panel active" id="tab-cpu">
      <div class="fixed-header">
        <div class="overall-bar">
          <div class="bar-fill" id="cpuOverallFill" style="width: 7%"></div>
          <div class="bar-label-center" id="cpuOverallText">7%</div>
        </div>
        <div class="bars-card" id="cpuDashBars"></div>
      </div>
      <div class="content-list" id="cpuClusters"></div>
    </section>

    <section class="tab-panel" id="tab-gpu">
      <div class="fixed-header">
        <div class="overall-bar">
          <div class="bar-fill" style="width: 32%"></div>
          <div class="bar-label-center">32%</div>
        </div>
        <div class="bars-card" id="gpuDashBars"></div>
      </div>
      <div class="content-list" id="gpuControls"></div>
    </section>

    <section class="tab-panel" id="tab-io">
      <div class="content-list" style="padding-top: 8px;">
        <div class="simple-card">
          <div class="simple-title">Bộ nhớ trong</div>
          <div class="simple-row">
            <div>
              <div>Lịch trình</div>
              <div class="muted">kyber</div>
            </div>
          </div>
          <div class="simple-row">
            <div>
              <div>Đọc trước</div>
              <div class="muted">512kB</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const clusters = [
      {
        name: "CPU 1",
        cores: "1,2,3",
        governor: "walt",
        governors: ["walt", "schedutil", "performance"],
        freqs: ["307MHz", "499MHz", "768MHz", "1,02GHz", "1,34GHz", "1,65GHz", "2,02GHz"],
        freqIdx: 6,
        curIdx: 6
      },
      {
        name: "CPU 2",
        cores: "4,5,6,7",
        governor: "walt",
        governors: ["walt", "schedutil", "performance"],
        freqs: ["499MHz", "768MHz", "1,05GHz", "1,34GHz", "1,65GHz", "2,02GHz", "2,80GHz"],
        freqIdx: 6,
        curIdx: 6
      },
      {
        name: "CPU 3",
        cores: "8",
        governor: "walt",
        governors: ["walt", "schedutil", "performance"],
        freqs: ["595MHz", "883MHz", "1,22GHz", "1,49GHz", "2,11GHz", "2,65GHz", "3,19GHz"],
        freqIdx: 6,
        curIdx: 6
      }
    ];

    const gpuCluster = [
      {
        name: "GPU",
        cores: null,
        governor: "msm-adreno-tz",
        governors: ["msm-adreno-tz", "performance", "powersave"],
        freqs: ["180MHz", "266MHz", "355MHz", "415MHz", "585MHz", "680MHz"],
        freqIdx: 5,
        curIdx: 3
      }
    ];

    const bootState = { cpu: false, gpu: false, io: false };
    let activeTab = "cpu";

    const bootToggle = document.getElementById("bootToggle");
    const bootSwitch = document.getElementById("bootSwitch");
    bootToggle.addEventListener("click", () => {
      bootState[activeTab] = !bootState[activeTab];
      bootSwitch.classList.toggle("on", bootState[activeTab]);
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
        document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === `tab-${activeTab}`));
        bootSwitch.classList.toggle("on", bootState[activeTab]);
      });
    });

    function renderBars(list, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = list.map((c) => {
        const pct = Math.round(((c.curIdx + 1) / c.freqs.length) * 100);
        return `
          <div class="bar-row">
            <span class="bar-row-name">${c.name}</span>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%"></div>
              <span class="bar-row-val">${c.freqs[c.curIdx]}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderControlList(list, containerId, dashId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      list.forEach((c, ci) => {
        const card = document.createElement("div");
        card.className = "cluster-card";
        card.innerHTML = `
          <div class="cluster-head">
            <div class="cluster-id">
              <div class="cluster-name">${c.name}</div>
              <div class="cluster-sub">TĐ.</div>
            </div>
            <div class="pill-select pill-gov">
              <select data-gov-ci="${ci}">
                ${c.governors.map((g) => `<option ${c.governor === g ? "selected" : ""}>${g}</option>`).join("")}
              </select>
            </div>
            ${c.cores ? `
              <div class="cores-box">
                <div>Lõi</div>
                <div>${c.cores}</div>
              </div>
            ` : ""}
          </div>
          <div class="freq-selector-row">
            <span class="freq-label">Xung nhịp</span>
            <div class="pill-select pill-freq">
              <span class="freq-val">${c.freqs[c.freqIdx]}</span>
              <div class="freq-dropdown">
                <span>▼</span>
                <select data-type="freq">
                  ${c.freqs.map((f, fi) => `<option value="${fi}" ${fi === c.freqIdx ? "selected" : ""}>${f}</option>`).join("")}
                </select>
              </div>
            </div>
          </div>
          <div class="slider-row">
            <button class="step-btn" data-step="-1">—</button>
            <input type="range" min="0" max="${c.freqs.length - 1}" value="${c.freqIdx}" />
            <button class="step-btn" data-step="1">+</button>
          </div>
        `;
        container.appendChild(card);

        const valEl = card.querySelector(".freq-val");
        const selectEl = card.querySelector('select[data-type="freq"]');
        const rangeInput = card.querySelector('input[type="range"]');

        const syncCard = () => {
          valEl.textContent = c.freqs[c.freqIdx];
          selectEl.value = String(c.freqIdx);
          rangeInput.value = String(c.freqIdx);
          c.curIdx = c.freqIdx;
          renderBars(list, dashId);
        };

        const applyFreq = (nextIdx) => {
          c.freqIdx = Math.max(0, Math.min(c.freqs.length - 1, nextIdx));
          syncCard();
        };

        selectEl.addEventListener("change", (e) => {
          applyFreq(Number(e.target.value));
        });

        rangeInput.addEventListener("input", (e) => {
          applyFreq(Number(e.target.value));
        });

        card.querySelectorAll(".step-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const delta = Number(btn.dataset.step);
            applyFreq(c.freqIdx + delta);
          });
        });

        card.querySelector("select[data-gov-ci]").addEventListener("change", (e) => {
          c.governor = e.target.value;
        });
      });
    }

    renderBars(clusters, "cpuDashBars");
    renderControlList(clusters, "cpuClusters", "cpuDashBars");
    renderBars(gpuCluster, "gpuDashBars");
    renderControlList(gpuCluster, "gpuControls", "gpuDashBars");
  </script>
</body>
</html>
