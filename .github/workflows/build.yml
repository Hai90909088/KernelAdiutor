name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign Release APK
        run: |
          KEYSTORE="${{ runner.temp }}/release.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=KernelAdiutor,O=Android,C=US"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/KernelAdiutor-release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelAdiutor-Release
          path: app/build/outputs/apk/release/KernelAdiutor-release.apk
